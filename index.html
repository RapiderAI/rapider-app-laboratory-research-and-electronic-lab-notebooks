<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Laboratory Research &amp; Electronic Lab Notebooks</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "eln-entries": "pages/eln-entries/eln-entries.html",
  "protocols": "pages/protocols/protocols.html",
  "entity-registry": "pages/entity-registry/entity-registry.html",
  "sample-containers": "pages/sample-containers/sample-containers.html",
  "freezer-storage": "pages/freezer-storage/freezer-storage.html",
  "assay-runs-board": "pages/assay-runs-board/assay-runs-board.html",
  "part11-signatures": "pages/part11-signatures/part11-signatures.html",
  "sar-tech-transfer": "pages/sar-tech-transfer/sar-tech-transfer.html",
  "eln-entry-detail": "pages/eln-entry-detail/eln-entry-detail.html",
  "entity-detail": "pages/entity-detail/entity-detail.html",
  "entity-drawer": "pages/entity-drawer/entity-drawer.html",
  "witness-sign-drawer": "pages/witness-sign-drawer/witness-sign-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
